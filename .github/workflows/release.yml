name: Semantic Release

on:
  push:
    branches:
      - main  # Set this to your default branch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0  # It's important to fetch all history for all branches and tags

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Set this to your Node.js version

      - name: Install dependencies
        run: npm ci  # It's recommended to use npm ci in CI/CD environments

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # Uncomment if you're publishing to npm
