# firebase-hosting-merge.yml
name: Deploy to Firebase Hosting on merge

'on':
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm ci

      - name: Update environment files with new version
        run: |
          VERSION=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "New version is $VERSION"
          node ./scripts/version-replacer.js $VERSION

      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERVING_U_APP_5D02D }}
          channelId: live
          projectId: servinguapp-5d02d
