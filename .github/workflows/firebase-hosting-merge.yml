name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - run: npm ci
      - name: Update version in environment files
        run: node ./scripts/version-replacer.js $(npx semantic-release --dry-run | grep "The next release version is" | cut -d " " -f 6)
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERVING_U_APP_5D02D }}'
          channelId: live
          projectId: servinguapp-5d02d
