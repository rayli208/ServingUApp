<app-header iconClass="fa-solid fa-tablet-screen-button" title="Tables Dashboard">
  <div class="table-dashboard-actions-container">
    <div class="table-dashboard-actions">
      <i class="fa-regular fa-circle-left" (click)="decreaseFloorPlan()" [class.disabled]="currentFloor === 1"></i>
      <h1>Current Floor: {{ getFloorName(currentFloor) }}</h1>
      <i class="fa-regular fa-circle-right" (click)="increaseFloorPlan()"></i>
    </div>
    <div>
      <button style="margin-right: 15px;" mat-raised-button (click)="drawer.toggle()"
        matTooltip="Waitlist">Waitlist</button>
      <button mat-raised-button color="primary" (click)="createTable()" matTooltip="Add Table">
        <span>Add Table</span>
      </button>
      <button style="margin-left: 15px;" mat-raised-button color="primary" (click)="openMassAssignDialog()"
        matTooltip="Mass Assign Tables" [disabled]="!clockedInEmployees?.length">
        <i class="fa-solid fa-bolt-lightning fa-2xl"></i>
      </button>
    </div>
  </div>
  <div class="table-view-small-screen-message">We cannot view the table manager because the screen is too small.</div>
</app-header>

<div class="table-dashboard-container">
  <mat-drawer-container class="table-drawer-container" [hasBackdrop]="true">
    <mat-drawer-content>
      <div class="table-all-table-container">
        <i class="table-all-table-container-no-tables" *ngIf="totalTables?.length == 0">There are no tables, please make
          some!</i>
        <app-tables-all-table-view [employees]="clockedInEmployees" [floorNumber]="currentFloor" [tables]="totalTables">
        </app-tables-all-table-view>
      </div>
      <div class="table-dashboard-container-split">
        <div #tableView class="table-view">
          <h1 class="table-view-current-floor">Current Floor: {{ getFloorName(currentFloor) }}</h1>
          <ng-container *ngFor="let table of totalTables">
            <div *ngIf="table.floorPlan === currentFloor" (dblclick)="toggleActive(table)" class="shape {{table.shape}}"
              cdkDragBoundary=".table-view" cdkDrag
              [style.background-image]="'url(' + getEmployeeImgById(table.employeeId) + ')'"
              [style.border]="table.isActive ? '2px solid #22C795' : '2px solid #EB5B5B'"
              [style.opacity]="table.isActive ? '1' : '0.3'" (cdkDragEnded)="dragEnd($event, table)"
              [style.top]="table.positionY + 'px'" [style.left]="table.positionX + 'px'">
              <div class="table-number" [ngStyle]="{ 'background-color': table.isActive ? '#22C795' : '#EB5B5B' }">
                {{ table.tableNumber }}
              </div>
            </div>
          </ng-container>
        </div>
        <div class="employee-view">
          <app-tables-employee-view [employees]="clockedInEmployees" [tables]="totalTables">
            </app-tables-employee-view>
        </div>
      </div>
    </mat-drawer-content>
    <mat-drawer #drawer mode="over" position="end">
      <app-tables-waitlist></app-tables-waitlist>
    </mat-drawer>
  </mat-drawer-container>
</div>
