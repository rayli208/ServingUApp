<div class="table-dashboard-container">
    <mat-drawer-container class="table-drawer-container" [hasBackdrop]="true">
        <mat-drawer-content>
            <p>tables-dashboard works!</p>
            <button mat-raised-button (click)="drawer.toggle()">Toggle drawer</button>
            <button mat-raised-button color="primary" (click)="createTable()">
                <span>Add Table</span>
            </button>
            <app-tables-all-table-view [tables]="totalTables"></app-tables-all-table-view>

            






            <div #tableView class="table-view">
                <div *ngFor="let table of totalTables" class="example-box" cdkDragBoundary=".table-view" cdkDrag
                    (cdkDragEnded)="dragEnd($event, table)">
                    {{table.tableNumber}}
                </div>
            </div>







        </mat-drawer-content>
        <mat-drawer #drawer mode="over" position="end">
            <app-tables-waitlist></app-tables-waitlist>
        </mat-drawer>
    </mat-drawer-container>
</div>
