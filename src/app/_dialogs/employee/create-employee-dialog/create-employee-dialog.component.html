<form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" novalidate>
    <h1 mat-dialog-title>Create an Employee</h1>
    <div mat-dialog-content>
        <div>
            <img (click)="fileUploader.click()" [src]="imgSrc" width="150px" height="150px" style="cursor: pointer;">
        </div>
        <div>
            <label for="Image">Image File</label>
            <input #fileUploader type="file" (change)="detectNewImage($event)" accept="*.png.jpg.jpeg">
        </div>
        <div>
            <mat-form-field appearance="outline">
                <mat-label>Name</mat-label>
                <input type="text" formControlName="name" matInput required>
            </mat-form-field>
        </div>
        <div>
            <mat-form-field appearance="outline">
                <mat-label>Position</mat-label>
                <input type="text" formControlName="position" matInput required>
            </mat-form-field>
        </div>
        <div>
            <mat-form-field appearance="outline">
                <mat-label>Employement Type</mat-label>
                <select formControlName="employmentType" matNativeControl required>
                    <option value="part-time">Part-time</option>
                    <option value="full-time">Full-time</option>
                    <option value="seasonal">Seasonal</option>
                    <option value="all">All</option>
                </select>
            </mat-form-field>
        </div>
        <div>
            <mat-form-field appearance="outline">
                <mat-label>Phone</mat-label>
                <input type="text" formControlName="phone" matInput required appPhoneNumberFormat>
            </mat-form-field>
        </div>
        <div>
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input type="email" formControlName="email" matInput required>
            </mat-form-field>
        </div>
    </div>
    <div mat-dialog-actions>
        <button mat-raised-button mat-dialog-close>Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="!employeeForm.valid" style="float: right;">Create</button>
    </div>
</form>
