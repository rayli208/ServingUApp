<form [formGroup]="editForm" (ngSubmit)="onSubmit()" novalidate>
    <div style="text-align: center;">
        <img (click)="fileUploader.click()" [src]="imgSrc" width="100px" height="100px" style="cursor: pointer; border-radius: 50%;">
    </div>
    <div>
        <label for="Image"></label>
        <input #fileUploader type="file" (change)="detectNewImage($event)" accept="*.png.jpg.jpeg">
    </div>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input type="text" formControlName="name" matInput required>
        </mat-form-field>
    </div>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input type="text" formControlName="email" matInput required>
        </mat-form-field>
    </div>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Color</mat-label>
            <input type="color" formControlName="color" matInput required>
        </mat-form-field>
    </div>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Phone</mat-label>
            <input type="text" formControlName="phone" matInput required appPhoneNumberFormat>
        </mat-form-field>
    </div>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Employement Type</mat-label>
            <select formControlName="employmentType" matNativeControl required>
                <option value="part-time">Part-time</option>
                <option value="full-time">Full-time</option>
                <option value="seasonal">Seasonal</option>
                <option value="all">All</option>
            </select>
        </mat-form-field>
    </div>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Position</mat-label>
            <input type="text" formControlName="position" matInput required>
        </mat-form-field>
    </div>
    <div>
        <mat-checkbox color="primary" formControlName="employeed">Active</mat-checkbox>
    </div>
    <div mat-dialog-actions style="justify-content: space-between;">
        <button mat-raised-button mat-dialog-close>Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="!editForm.valid || !editForm.dirty"  style="float: right;">Update</button>
    </div>
</form>
