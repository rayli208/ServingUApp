<h1><i class="fas fa-user"></i>Punch Clock Dashboard</h1>

<div class="punch-clock-dashboard-container">
    <div class="punch-clock-dashboard-container-half">
        <h2>
            Employees:
        </h2>
        <div *ngFor="let employee of Employees; let i = index">
            <!--Outline border based off hire status-->
            <ng-container *ngIf="employee.employeed">
                <div class="punch-clock-dashboard-card">
                    <img class="punch-clock-dashboard-card-header-profile" [ngClass]="{ 'green': employee.clockedIn }"
                        src="{{employee.imgUrl}}">
                    <div>
                        <div class="punch-clock-dashboard-card-header-name">
                            <span>{{employee.name | titlecase}}</span>
                            <span class="punch-clock-dashboard-card-header-color"
                                [style.background-color]="employee.color"></span>
                        </div>
                        <div class="punch-clock-dashboard-card-header-position">{{employee.position | titlecase}}
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
    <div class="punch-clock-dashboard-container-half">
        <h2>
            Clocked in:
        </h2>
    </div>
</div>
