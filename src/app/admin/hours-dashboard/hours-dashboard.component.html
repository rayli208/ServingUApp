<app-header iconClass="fa-solid fa-clipboard-list" title="Hours Editor">
    <div class="hours-dashboard-date-range">
        <mat-form-field appearance="outline">
            <mat-label>Enter a date range</mat-label>
            <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
                <input matStartDate formControlName="start" placeholder="Start date">
                <input matEndDate formControlName="end" placeholder="End date">
            </mat-date-range-input>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-date-range-picker #picker></mat-date-range-picker>

            <mat-error *ngIf="range.controls.start.hasError('matStartDateInvalid')">Invalid start date</mat-error>
            <mat-error *ngIf="range.controls.end.hasError('matEndDateInvalid')">Invalid end date</mat-error>
        </mat-form-field>
    </div>
</app-header>

<div class="timestamps-list">
    <h2>User's Time Stamps:</h2>
    <ul>
        <li *ngFor="let timestamp of timestamps">
            <div>
                <h2>{{timestamp.employeeName}}'s TimeStamp</h2>
                <p>Start Time: {{timestamp.startTime | date:'short'}}</p>
                <p>End Time: {{timestamp.endTime | date:'short'}}</p>
              </div>
              
        </li>
    </ul>
</div>
