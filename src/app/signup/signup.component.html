<h1>Sign Up</h1>
<mat-card appearance="outlined" class="form-card">
    <form [formGroup]="signupForm" (ngSubmit)="signup()">
        <p>
            <mat-form-field appearance="outline">
                <mat-label>Owner</mat-label>
                <input autocomplete="off" formControlName="owner" type="text" matInput placeholder="Owner">
            </mat-form-field>
        </p>
        <p>
            <mat-form-field appearance="outline">
                <mat-label>Location Name</mat-label>
                <input autocomplete="off" formControlName="location_name" type="text" matInput placeholder="Location Name">
            </mat-form-field>
        </p>
        <p>
            <mat-form-field appearance="outline">
                <mat-label>Description</mat-label>
                <textarea rows="8" formControlName="description" type="text" matInput placeholder="Describe Your Business"></textarea>
            </mat-form-field>
        </p>
        <p>
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input formControlName="email" type="email" matInput placeholder="Email">
            </mat-form-field>
        </p>
        <p>
            <mat-form-field appearance="outline">
                <mat-label>Phone</mat-label>
                <input formControlName="phone" type="tel" matInput placeholder="Phone" appPhoneNumberFormat>
            </mat-form-field>
        </p>
        <p>
            <mat-form-field appearance="outline">
                <mat-label>Website</mat-label>
                <input formControlName="website" type="text" matInput placeholder="Website">
            </mat-form-field>
        </p>
        <p>
            <mat-form-field appearance="outline">
                <mat-label>Address</mat-label>
                <textarea rows="8" formControlName="address" type="text" matInput placeholder="Address"></textarea>
            </mat-form-field>
        </p>
        <p>
            <mat-form-field appearance="outline">
                <mat-label>Zip</mat-label>
                <textarea rows="8" formControlName="zip" type="text" matInput placeholder="Zip Code"></textarea>
            </mat-form-field>
        </p>
        <p>
            <mat-form-field appearance="outline">
                <mat-label>School</mat-label>
                <select formControlName="school" matNativeControl required>
                    <option value="None">None</option>
                    <option value="West Chester University">West Chester University</option>
                </select>
            </mat-form-field>
        </p>
        <p>
            <mat-form-field appearance="outline">
                <mat-label>Pin</mat-label>
                <input autocomplete="off" formControlName="pin" matInput placeholder="Pin">
            </mat-form-field>
        </p>
        <p>
            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input autocomplete="off" formControlName="password" type="password" matInput placeholder="Password">
            </mat-form-field>
        </p>
        <div *ngIf="firebaseErrorMessage != ''" class="error-style">
            <span>{{ firebaseErrorMessage }}</span>
        </div>

        <button mat-raised-button color="primary">Signup</button>
    </form>
</mat-card>

<div class="progressIndicator" [style.display]="isProgressVisible ? 'inline' : 'none' ">
    <mat-progress-spinner class=" example-margin" color="primary" mode="indeterminate"></mat-progress-spinner>
</div>
