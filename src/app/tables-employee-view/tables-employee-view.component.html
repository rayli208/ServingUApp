<div class="tables-employee-view-container">
  <i *ngIf="!employees.length" class="tables-employee-view-empty">There are no employees clocked in</i>
  <div *ngFor="let employee of employees" class="tables-employee-view-card">
    <div class="tables-employee-view-card-body">
      <div style="display: flex">
        <img class="tables-employee-view-card-header-profile" src="{{employee.imgUrl}}" [ngClass]="{ 'green': employee.clockedIn }">
        <div class="tables-employee-view-card-header-name">
          <div>{{employee.name | titlecase}}</div>
          <div class="tables-employee-view-card-header-position">{{employee.position | titlecase}}</div>
        </div>
      </div>
      <div class="tables-employee-view-card-serving">
        <i *ngIf="!groupedTablesByEmployee[employee.id] || !getFloors(groupedTablesByEmployee[employee.id]).length">There are no tables assigned to this employee atm</i>
        <ng-container *ngIf="groupedTablesByEmployee[employee.id]">
          <ng-container *ngFor="let floor of getFloors(groupedTablesByEmployee[employee.id])">
            <h3 class="floor-header">Floor {{ floor }}:</h3>
            <div class="table-container">
              <div *ngFor="let table of getTablesByFloor(groupedTablesByEmployee[employee.id], floor)" class="table-item" [ngClass]="{'active-table': table.isActive, 'inactive-table': !table.isActive}">
                <div (dblclick)="toggleActive(table)">
                  <div class="table-item-content"><b>{{table.tableNumber}}</b></div>
                </div>
              </div>
            </div>
          </ng-container>
        </ng-container>
      </div>
    </div>
  </div>
</div>
